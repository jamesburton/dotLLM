name: Release

# Two entry points, one pipeline:
#   - a pushed tag `v*` (a deliberate stable/preview release), and
#   - workflow_call from ci.yml, which publishes a `0.x.y-dev.<n>` prerelease for every green push to `dev`.
# Dev tags are excluded from the tag trigger so a manually pushed dev tag cannot start a second, competing run.
on:
  push:
    tags: ['v*', '!v*-dev.*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create/publish, e.g. v0.3.0-dev.2250'
        type: string
        required: true
      skip-aot:
        description: 'Skip the experimental Native AOT archives (dev builds do)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - id: set
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  pack-nuget:
    name: Pack NuGet packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props

      - name: Restore
        run: dotnet restore

      - name: Pack
        # DOTLLM_TOOL_PACKAGE_ID (repo variable) renames the dotnet-tool package - upstream owns the DotLLM.* ids on nuget.org (docs/PACKAGING.md).
        run: dotnet pack -c Release --no-restore -o artifacts/nuget -p:MinVerVersionOverride=${{ needs.version.outputs.version }} -p:DotLlmToolPackageId=${{ vars.DOTLLM_TOOL_PACKAGE_ID }}

      - name: List packages
        run: ls -lh artifacts/nuget/

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

  publish-single-file:
    name: Publish single-file (${{ matrix.rid }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            exe: dotllm
          - os: windows-latest
            rid: win-x64
            archive: zip
            exe: dotllm.exe
          - os: macos-14
            rid: osx-arm64
            archive: tar.gz
            exe: dotllm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/DotLLM.Cli/DotLLM.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:MinVerVersionOverride=${{ needs.version.outputs.version }} \
            -o publish/${{ matrix.rid }}

      # (#455) The Windows system tray. Self-contained single-file, matching the CLI above, and
      # deliberately NOT trimmed or AOT: WinForms supports neither. It ships in the same archive
      # so dotllm.exe ends up beside dotllm-tray.exe, which is the layout the tray's executable
      # locator probes first. See docs/TRAY.md.
      - name: Publish tray (Windows only)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet publish src/DotLLM.Tray/DotLLM.Tray.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:MinVerVersionOverride=${{ needs.version.outputs.version }} \
            -o publish-tray/win-x64

      - name: Stage release payload
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          stage="stage/dotllm-${version}-${{ matrix.rid }}"
          mkdir -p "$stage"
          cp "publish/${{ matrix.rid }}/${{ matrix.exe }}" "$stage/"
          if [ -f "publish-tray/win-x64/dotllm-tray.exe" ]; then
            cp "publish-tray/win-x64/dotllm-tray.exe" "$stage/"
          fi
          if [ -d "publish/${{ matrix.rid }}/ptx" ]; then
            cp -r "publish/${{ matrix.rid }}/ptx" "$stage/"
          fi
          # (#712) Vulkan SPIR-V blobs are loaded from spv/ beside the executable (VulkanModelLoader.ResolveSpvDir); without them the
          # Vulkan backend cannot start from a release archive. The publish step emits them; fail the release if they did not ship.
          if [ -d "publish/${{ matrix.rid }}/spv" ]; then
            cp -r "publish/${{ matrix.rid }}/spv" "$stage/"
          fi
          if ! ls "$stage/spv/"*.spv >/dev/null 2>&1; then
            echo "::error::release payload has no spv/*.spv - the Vulkan backend would be broken"
            exit 1
          fi
          cp README.md "$stage/"
          cp LICENSE "$stage/"
          ls -lh "$stage/"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $stage = "stage/dotllm-$version-${{ matrix.rid }}"
          $out = "artifacts/dotllm-$version-${{ matrix.rid }}.zip"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath $out -Force
          Get-Item $out

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          stage="stage/dotllm-${version}-${{ matrix.rid }}"
          out="artifacts/dotllm-${version}-${{ matrix.rid }}.tar.gz"
          mkdir -p artifacts
          tar -czf "$out" -C stage "dotllm-${version}-${{ matrix.rid }}"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: single-file-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  publish-aot:
    name: Publish AOT (${{ matrix.rid }}, experimental)
    needs: version
    if: ${{ !inputs.skip-aot }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            exe: dotllm
          - os: windows-latest
            rid: win-x64
            archive: zip
            exe: dotllm.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props

      - name: Install AOT dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (AOT)
        shell: bash
        run: |
          dotnet publish src/DotLLM.Cli/DotLLM.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:MinVerVersionOverride=${{ needs.version.outputs.version }} \
            -o publish-aot/${{ matrix.rid }}

      - name: Stage release payload
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          stage="stage/dotllm-${version}-aot-${{ matrix.rid }}"
          mkdir -p "$stage"
          cp "publish-aot/${{ matrix.rid }}/${{ matrix.exe }}" "$stage/"
          if [ -d "publish-aot/${{ matrix.rid }}/ptx" ]; then
            cp -r "publish-aot/${{ matrix.rid }}/ptx" "$stage/"
          fi
          cp README.md "$stage/"
          cp LICENSE "$stage/"
          ls -lh "$stage/"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $stage = "stage/dotllm-$version-aot-${{ matrix.rid }}"
          $out = "artifacts/dotllm-$version-aot-${{ matrix.rid }}.zip"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath $out -Force
          Get-Item $out

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          stage="stage/dotllm-${version}-aot-${{ matrix.rid }}"
          out="artifacts/dotllm-${version}-aot-${{ matrix.rid }}.tar.gz"
          mkdir -p artifacts
          tar -czf "$out" -C stage "dotllm-${version}-aot-${{ matrix.rid }}"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  push-nuget:
    name: Push dotnet tool to NuGet.org
    needs: [version, pack-nuget, publish-single-file]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # NuGet trusted publishing: the job's OIDC token is exchanged for a 1-hour API key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      # The fork cannot push the upstream-owned DotLLM.* ids, so nothing is published until the repo variable
      # DOTLLM_TOOL_PACKAGE_ID names a package id this account owns (docs/PACKAGING.md lists the options).
      # Only that one package ships - it is what `dnx <id>` / `dotnet tool install -g <id>` runs.
      # Preferred: trusted publishing (no stored secret). Enabled by the repo variable NUGET_USER (the nuget.org profile name, not an
      # email); the policy lives on nuget.org (docs/PACKAGING.md). Falls back to a NUGET_API_KEY secret when NUGET_USER is unset.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        if: ${{ vars.NUGET_USER != '' && vars.DOTLLM_TOOL_PACKAGE_ID != '' }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push tool package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
          TOOL_ID: ${{ vars.DOTLLM_TOOL_PACKAGE_ID }}
        run: |
          if [ -z "$TOOL_ID" ]; then
            echo "::notice::DOTLLM_TOOL_PACKAGE_ID is not set - skipping the NuGet push (see docs/PACKAGING.md)."
            exit 0
          fi
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::neither NUGET_USER (trusted publishing) nor NUGET_API_KEY is set - skipping the NuGet push of $TOOL_ID."
            exit 0
          fi
          shopt -s nullglob
          pkgs=(artifacts/nuget/"$TOOL_ID".*.nupkg)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::no $TOOL_ID.*.nupkg was packed"
            exit 1
          fi
          for p in "${pkgs[@]}"; do
            dotnet nuget push "$p" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    needs: [version, pack-nuget, publish-single-file, publish-aot]
    # AOT is optional (experimental, and skipped for dev builds); everything else must have succeeded.
    if: ${{ !cancelled() && needs.pack-nuget.result == 'success' && needs.publish-single-file.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' -o -name '*.snupkg' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      # Integrity for anything downloaded from this release: a checksum file, and a signed build-provenance attestation that ties
      # each asset to this repository, workflow and commit (verify with `gh attestation verify <file> --repo <owner>/<repo>`).
      # That is the trust signal available without an Authenticode certificate - see docs/PACKAGING.md.
      - name: Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Compose release notes preamble
        shell: bash
        env:
          TOOL_ID: ${{ vars.DOTLLM_TOOL_PACKAGE_ID }}
        run: |
          version="${{ needs.version.outputs.version }}"
          repo="${{ github.repository }}"
          {
            echo "**dotLLM $version** (\`$repo\`, commit \`${GITHUB_SHA::9}\`) - high-performance LLM inference engine for .NET."
            echo
            echo "Download the self-contained archive for your platform below, unpack it, and run \`dotllm run QuantFactory/SmolLM-135M-GGUF -p \"Hello\" -n 64\`. No .NET runtime required. The Windows archive also holds \`dotllm-tray.exe\`."
            echo
            echo "**Verify a download** (these builds are not Authenticode-signed): compare against \`SHA256SUMS\`, or check the provenance attestation: \`gh attestation verify <file> --repo $repo\`"
            echo
            echo "Experimental Native AOT builds (Linux / Windows) are attached to tagged releases only."
            if [ -n "$TOOL_ID" ]; then
              echo
              echo "Run without installing: \`dnx $TOOL_ID --version $version\` - or install as a tool: \`dotnet tool install -g $TOOL_ID --version $version\`"
            fi
            echo
            echo "---"
          } > release-notes-preamble.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: dotLLM ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: release-notes-preamble.md
          files: release-assets/*
          fail_on_unmatched_files: true
