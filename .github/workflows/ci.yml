name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: '10.x'

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }}

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Unit Tests
        run: dotnet test tests/DotLLM.Tests.Unit/ -c Release --filter "Category!=GPU&Category!=Benchmark" --blame-hang-timeout 5m

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The model cache is split into restore + save (#526). `actions/cache` saves in a
      # post-job step that only runs when the job succeeds ("On a cache miss, the action
      # automatically creates a new cache if the job completes successfully" — GitHub
      # dependency-caching docs), so a red integration suite could never populate the cache,
      # which made fixture-gated coverage differ run to run. `actions/cache/save` with
      # `if: always()` is the documented remedy for exactly this ("the builds would run for
      # hours and the cache couldn't be saved as the workflow failed in between" —
      # actions/cache save/README.md).
      #
      # The NuGet caches above are deliberately left as plain `actions/cache`: the green
      # `build` job saves the identical key, so they self-heal.

      - name: Resolve test model fixture manifest
        id: fixtures
        run: |
          # The fixture set is the literal argument pairs of TestModelDownloader.EnsureModelAsync,
          # so the cache key tracks the source of truth and needs no hand-bumped version suffix.
          # Brittleness note: this only sees single-line call sites. If a call is ever split
          # across lines the grep misses it, the key stops rotating for that entry, and the
          # guard below fires if every call site goes multi-line.
          manifest=$(grep -rhoE 'EnsureModelAsync\("[^"]+", *"[^"]+"\)' tests/DotLLM.Tests.Integration --include='*.cs' \
            | sed -E 's|EnsureModelAsync\("([^"]+)", *"([^"]+)"\)|\1/\2|' \
            | LC_ALL=C sort -u || true)
          if [ -z "$manifest" ]; then
            echo "::error::No EnsureModelAsync fixtures found — the model-cache key cannot be derived (#526)."
            exit 1
          fi
          printf '%s\n' "$manifest" > "$RUNNER_TEMP/test-models.manifest"
          expected=$(printf '%s\n' "$manifest" | wc -l | tr -d ' ')
          hash=$(printf '%s\n' "$manifest" | sha256sum | cut -c1-16)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Fixture manifest ($expected entries, hash $hash):"
          sed 's/^/  - /' "$RUNNER_TEMP/test-models.manifest"

      - name: Restore test models
        id: restore-models
        uses: actions/cache/restore@v4
        with:
          path: ~/.dotllm/test-cache
          # Exact key == "every fixture in the current manifest is in this entry".
          key: dotllm-test-models-${{ steps.fixtures.outputs.hash }}-${{ steps.fixtures.outputs.expected }}
          # Fall back to a partial entry for this manifest, then to any older manifest's
          # entry — either way the run downloads only the delta and saves the union below.
          restore-keys: |
            dotllm-test-models-${{ steps.fixtures.outputs.hash }}-
            dotllm-test-models-

      - name: Integration Tests
        run: dotnet test tests/DotLLM.Tests.Integration/ -c Release --blame-hang-timeout 5m

      - name: Inventory cached test models
        id: inventory
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/test-models.manifest" ]; then
            echo "No manifest — the resolve step did not complete; nothing to inventory."
            echo "present=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          present=0
          bytes=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            f="$HOME/.dotllm/test-cache/$rel"
            if [ -f "$f" ]; then
              present=$((present + 1))
              bytes=$((bytes + $(stat -c %s "$f")))
              echo "  cached : $rel"
            else
              echo "  MISSING: $rel"
            fi
          done < "$RUNNER_TEMP/test-models.manifest"
          echo "$present of ${{ steps.fixtures.outputs.expected }} fixtures present ($((bytes / 1048576)) MiB)"
          echo "present=$present" >> "$GITHUB_OUTPUT"

      # Saving under the *actual* fixture count is what makes a partial cache converge:
      # a run that ends with 5 of 7 saves `...-5`, the next run prefix-restores it, fetches
      # the rest and saves `...-7` — which is then the exact restore key, so later runs hit
      # it and skip the save. Re-saving an existing key is a warning, not a failure
      # (actions/cache src/saveImpl.ts wraps the save in try/catch -> logWarning).
      - name: Save test models
        if: always() && steps.restore-models.outputs.cache-hit != 'true' && steps.inventory.outputs.present != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/.dotllm/test-cache
          key: dotllm-test-models-${{ steps.fixtures.outputs.hash }}-${{ steps.inventory.outputs.present }}
