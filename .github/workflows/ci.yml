name: CI

on:
  push:
    # `dev` is here for the model cache, not only for post-merge CI (#526): a cache saved by
    # a pull_request run belongs to the merge ref (`refs/pull/.../merge`) and "can only be
    # restored by re-runs of the pull request", while a run may restore caches from its own
    # branch, its base branch or the default branch (GitHub dependency-caching docs,
    # "Restrictions for accessing a cache"). PRs in this fork target `dev`, so without a
    # `dev`-triggered run nothing ever writes an entry that a *different* PR can read, and
    # every PR's first run would still start cold.
    branches: [main, dev]
  pull_request:

env:
  DOTNET_VERSION: '10.x'

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }}

      # (#1964) Third-party notices are generated at publish and FAIL the build for a bundled dependency whose licence they cannot
      # reproduce. Release packs/publishes only after merge (release.yml), so exercise the same targets here: both tool packages
      # (framework-dependent) and one self-contained CLI publish (adds the .NET runtime packs), then check the files shipped.
      - name: Third-party notices (tool packs + self-contained publish)
        if: matrix.configuration == 'Release'
        run: |
          set -euo pipefail
          dotnet pack tools/DotLLM.ChunkCache -c Release --no-restore -o artifacts/ci-notices
          dotnet pack src/DotLLM.Cli -c Release --no-restore -o artifacts/ci-notices
          dotnet publish src/DotLLM.Cli/DotLLM.Cli.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o artifacts/ci-notices/linux-x64
          # The listing is captured first: piping unzip into `grep -q` under pipefail fails on unzip's SIGPIPE.
          for p in artifacts/ci-notices/dotllm-chunkcache.*.nupkg artifacts/ci-notices/DotLLM.Cli.*.nupkg; do
            listing="$(unzip -Z1 "$p")"
            grep -qx 'NOTICE' <<< "$listing" || { echo "::error::$p has no NOTICE"; exit 1; }
            grep -qx 'tools/net10.0/any/THIRD-PARTY-NOTICES.txt' <<< "$listing" || { echo "::error::$p has no THIRD-PARTY-NOTICES.txt"; exit 1; }
          done
          grep -q 'microsoft.netcore.app.runtime.linux-x64' artifacts/ci-notices/linux-x64/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::the self-contained publish's notices do not list the .NET runtime pack"; exit 1; }
          grep -q 'The ggml authors' artifacts/ci-notices/linux-x64/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::the notices do not carry the repository NOTICE (llama.cpp / ggml)"; exit 1; }

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # VulkanSpvFreshnessTests recompiles every tracked .comp with the glslc pinned in native/vulkan/glslc.version
      # and compares bytes with the committed .spv (#1364). It Skips when glslc is missing or is not the pin, which on
      # a bare runner silently disabled the check (#1372). The pinned shaderc ships in the LunarG Vulkan SDK
      # (SDK 1.4.341.1 = shaderc v2026.1); only the glslc binary is extracted and cached. The verify step fails the
      # job if the installed glslc is not the pin, so the test can no longer skip unnoticed.
      - name: Cache pinned glslc
        id: glslc-cache
        uses: actions/cache@v4
        with:
          path: ~/glslc-bin
          key: glslc-${{ runner.os }}-sdk-1.4.341.1-${{ hashFiles('native/vulkan/glslc.version') }}

      - name: Install pinned glslc
        if: steps.glslc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/glslc-bin /tmp/vksdk
          curl -fsSL --retry 5 "https://sdk.lunarg.com/sdk/download/1.4.341.1/linux/vulkansdk-linux-x86_64-1.4.341.1.tar.xz" | tar -xJ -C /tmp/vksdk --wildcards '*/x86_64/bin/glslc'
          cp /tmp/vksdk/*/x86_64/bin/glslc ~/glslc-bin/glslc
          chmod +x ~/glslc-bin/glslc

      - name: Verify glslc is the pinned version
        run: |
          echo "$HOME/glslc-bin" >> "$GITHUB_PATH"
          pin="$(head -n1 native/vulkan/glslc.version | tr -d '\r')"
          got="$("$HOME/glslc-bin/glslc" --version | head -n1)"
          echo "pin='$pin' glslc='$got'"
          case "$got" in "$pin"*) ;; *) echo "::error::glslc '$got' is not the pinned '$pin' (native/vulkan/glslc.version); VulkanSpvFreshnessTests would skip"; exit 1 ;; esac

      - name: Unit Tests
        run: python3 scripts/ci/test-retry.py --label unit -- dotnet test tests/DotLLM.Tests.Unit/ -c Release --filter "Category!=GPU&Category!=Benchmark" --blame-hang-timeout 5m

      # The MIT client package has no DotLLM.* project references, so its tests are a separate project.
      # The Overhead benchmark test is Release-only/Category=Benchmark and stays out of CI.
      - name: Chunk-cache client tests
        env:
          DOTLLM_CI_RETRY_DEMO: once   # TEMPORARY demo (#2052); removed before merge
        run: python3 scripts/ci/test-retry.py --label chunkcache-client -- dotnet test tests/DotLLM.ChunkCache.Client.Tests/ -c Release --filter "Category!=Benchmark" --blame-hang-timeout 5m

      # The freshness test is a SkippableFact, and the full run above only prints totals: assert here that it really ran.
      - name: Tracked .spv freshness actually ran (not skipped)
        run: |
          out="$(dotnet test tests/DotLLM.Tests.Unit/ -c Release --no-build --filter "FullyQualifiedName~VulkanSpvFreshnessTests")"
          echo "$out" | tail -n 5
          echo "$out" | grep -E "Passed: +1, Skipped: +0" >/dev/null || { echo "::error::VulkanSpvFreshnessTests did not run to a pass"; exit 1; }

      # The SSE-only tiers (e.g. KQuantSseTierTests) are gated on `Ssse3 && !Avx2`, so on AVX2 runners they
      # never execute. Re-run the CPU kernel tests with the wide ISAs disabled so those tiers are exercised
      # (found via a Westmere box with no AVX, #602).
      #
      # The filter is the whole CPU-side unit suite (not just DotLLM.Tests.Unit.Cpu): the Flint/LittleBit model tests that need a
      # specific tier live under Models and were never exercised without AVX2 (#1623). Vulkan tests are excluded (no device here).
      - name: CPU tests (AVX/AVX2/AVX-512 disabled)
        env:
          DOTNET_EnableAVX: "0"
          DOTNET_EnableAVX2: "0"
          # .NET 10 groups AVX-512 F/BW/CD/DQ/VL under one knob; DOTNET_EnableAVX512F alone is ignored there (#1623, measured on 10.0.11).
          # EnableAVX=0 already implies it - this is explicit, not load-bearing.
          DOTNET_EnableAVX512: "0"
        run: python3 scripts/ci/test-retry.py --label unit-noavx -- dotnet test tests/DotLLM.Tests.Unit/ -c Release --no-build --filter "FullyQualifiedName!~DotLLM.Tests.Unit.Vulkan&Category!=GPU&Category!=Benchmark" --blame-hang-timeout 5m

      # DOTLLM_CPU_ISA (src/DotLLM.Cpu/CpuFeatures.cs, docs/CPU_FEATURE_GATING.md) caps the highest tier dotLLM dispatches to, on a
      # runner that has everything: scalar = no SIMD intrinsics at all, v128 = SSSE3/SSE4.1 only, avx2 = no AVX-512.
      # Complements the DOTNET_Enable* leg above, which changes what the runtime reports rather than what dotLLM chooses.
      - name: CPU tests (DOTLLM_CPU_ISA tier caps)
        run: |
          fail=0
          for isa in scalar v128 avx2; do
            echo "::group::DOTLLM_CPU_ISA=$isa"
            DOTLLM_CPU_ISA=$isa python3 scripts/ci/test-retry.py --label "unit-isa-$isa" -- dotnet test tests/DotLLM.Tests.Unit/ -c Release --no-build --filter "FullyQualifiedName!~DotLLM.Tests.Unit.Vulkan&Category!=GPU&Category!=Benchmark" --blame-hang-timeout 5m || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # TRX results of both attempts plus --blame-crash sequences/dumps (#2052, #2055).
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The model cache is split into restore + save (#526). `actions/cache` saves in a
      # post-job step that only runs when the job succeeds ("On a cache miss, the action
      # automatically creates a new cache if the job completes successfully" — GitHub
      # dependency-caching docs), so a red integration suite could never populate the cache,
      # which made fixture-gated coverage differ run to run. `actions/cache/save` with
      # `if: always()` is the documented remedy for exactly this ("the builds would run for
      # hours and the cache couldn't be saved as the workflow failed in between" —
      # actions/cache save/README.md).
      #
      # The NuGet caches above are deliberately left as plain `actions/cache`: the green
      # `build` job saves the identical key, so they self-heal.

      - name: Resolve test model fixture manifest
        id: fixtures
        run: |
          # The fixture set is the literal argument pairs of TestModelDownloader.EnsureModelAsync,
          # so the cache key tracks the source of truth and needs no hand-bumped version suffix.
          # Brittleness note: this only sees single-line call sites. If a call is ever split
          # across lines the grep misses it, the key stops rotating for that entry, and the
          # guard below fires if every call site goes multi-line.
          manifest=$(grep -rhoE 'EnsureModelAsync\("[^"]+", *"[^"]+"\)' tests/DotLLM.Tests.Integration --include='*.cs' \
            | sed -E 's|EnsureModelAsync\("([^"]+)", *"([^"]+)"\)|\1/\2|' \
            | LC_ALL=C sort -u || true)
          if [ -z "$manifest" ]; then
            echo "::error::No EnsureModelAsync fixtures found — the model-cache key cannot be derived (#526)."
            exit 1
          fi
          printf '%s\n' "$manifest" > "$RUNNER_TEMP/test-models.manifest"
          expected=$(printf '%s\n' "$manifest" | wc -l | tr -d ' ')
          hash=$(printf '%s\n' "$manifest" | sha256sum | cut -c1-16)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Fixture manifest ($expected entries, hash $hash):"
          sed 's/^/  - /' "$RUNNER_TEMP/test-models.manifest"

      - name: Restore test models
        id: restore-models
        uses: actions/cache/restore@v4
        with:
          path: ~/.dotllm/test-cache
          # Exact key == "every fixture in the current manifest is in this entry".
          key: dotllm-test-models-${{ steps.fixtures.outputs.hash }}-${{ steps.fixtures.outputs.expected }}
          # Fall back to a partial entry for this manifest, then to any older manifest's
          # entry — either way the run downloads only the delta and saves the union below.
          restore-keys: |
            dotllm-test-models-${{ steps.fixtures.outputs.hash }}-
            dotllm-test-models-

      - name: Integration Tests
        run: python3 scripts/ci/test-retry.py --label integration -- dotnet test tests/DotLLM.Tests.Integration/ -c Release --blame-hang-timeout 5m

      - name: Inventory cached test models
        id: inventory
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/test-models.manifest" ]; then
            echo "No manifest — the resolve step did not complete; nothing to inventory."
            echo "present=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          present=0
          bytes=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            f="$HOME/.dotllm/test-cache/$rel"
            if [ -f "$f" ]; then
              present=$((present + 1))
              bytes=$((bytes + $(stat -c %s "$f")))
              echo "  cached : $rel"
            else
              echo "  MISSING: $rel"
            fi
          done < "$RUNNER_TEMP/test-models.manifest"
          echo "$present of ${{ steps.fixtures.outputs.expected }} fixtures present ($((bytes / 1048576)) MiB)"
          echo "present=$present" >> "$GITHUB_OUTPUT"

      # Saving under the *actual* fixture count is what makes a partial cache converge:
      # a run that ends with 5 of 7 saves `...-5`, the next run prefix-restores it, fetches
      # the rest and saves `...-7` — which is then the exact restore key, so later runs hit
      # it and skip the save. Re-saving an existing key is a warning, not a failure
      # (actions/cache src/saveImpl.ts wraps the save in try/catch -> logWarning).
      - name: Save test models
        if: always() && steps.restore-models.outputs.cache-hit != 'true' && steps.inventory.outputs.present != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/.dotllm/test-cache
          key: dotllm-test-models-${{ steps.fixtures.outputs.hash }}-${{ steps.inventory.outputs.present }}

      # TRX results of both attempts plus --blame-crash sequences/dumps (#2052, #2055).
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---- Fork dev channel ---------------------------------------------------------------------------------------------------------
  # Every push to `dev` that passes the jobs above publishes a prerelease `v<DEV_BASE_VERSION>-dev.<commit count>` through the same
  # pipeline as a tagged release (release.yml): archives, SHA256SUMS, provenance attestation. The commit count only ever grows on
  # `dev`, and numeric prerelease identifiers compare numerically, so the tray's update check orders these correctly - and
  # 0.3.0-dev.* outranks upstream's 0.2.0-alpha.* tags. When a stable fork release is cut (tag v0.3.0), bump DEV_BASE_VERSION.
  dev-version:
    name: Dev version
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository != 'kkokosa/dotLLM'
    needs: [build, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    env:
      DEV_BASE_VERSION: '0.3.0'
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "tag=v${DEV_BASE_VERSION}-dev.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  dev-release:
    name: Dev release
    needs: dev-version
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.dev-version.outputs.tag }}
      skip-aot: true
    secrets: inherit

  # Keep the newest 15 dev prereleases (and their tags); the feed the tray reads stays short and the release page stays readable.
  dev-prune:
    name: Prune old dev releases
    needs: dev-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev[.][0-9]+$"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
